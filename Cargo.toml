[workspace]
resolver = "2"
members = [
    "crates/ag-corpus",
    "crates/ag-engine",
    "crates/ag-cli",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"

[profile.release]
opt-level = 2
lto = "thin"
