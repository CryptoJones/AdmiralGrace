[workspace]
resolver = "2"
members = [
    "crates/ag-corpus",
    "crates/ag-engine",
    "crates/ag-image",
    "crates/ag-cli",
    "crates/ag-debug",
    "ui",
]

[workspace.package]
version = "0.38.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
# The loader and analyzer tier of the kuna decompiler (Apache-2.0, see NOTICE),
# pinned to a commit: the crates are not published.
kuna-analysis = { git = "https://github.com/Noelo-Lab/kuna", rev = "28219c99ff90d89b15010ac25431b8a6374e46b3" }
# The SLEIGH runtime of the same tree, and the two crates its types come from:
# the ARM and Thumb decoder reads Ghidra's processor specifications through it.
kuna-sleigh = { git = "https://github.com/Noelo-Lab/kuna", rev = "28219c99ff90d89b15010ac25431b8a6374e46b3" }
kuna-base = { git = "https://github.com/Noelo-Lab/kuna", rev = "28219c99ff90d89b15010ac25431b8a6374e46b3" }
kuna-num = { git = "https://github.com/Noelo-Lab/kuna", rev = "28219c99ff90d89b15010ac25431b8a6374e46b3" }
# The demanglers: Itanium C++, Microsoft C++ and Rust names, read back to the
# names the source spelled.
cpp_demangle = "0.5.1"
# The DWARF call-frame reader, for the `.eh_frame` that names a function's
# start and end where no symbol does.
gimli = { version = "0.33", default-features = false, features = ["read"] }
msvc-demangler = "0.11.0"
rustc-demangle = "0.1.28"

[profile.release]
opt-level = 2
lto = "thin"
