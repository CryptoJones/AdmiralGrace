[workspace]
resolver = "2"
members = [
    "crates/ag-corpus",
    "crates/ag-engine",
    "crates/ag-image",
    "crates/ag-cli",
    "ui",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
# The loader and analyzer tier of the kuna decompiler (Apache-2.0, see NOTICE),
# pinned to a commit: the crates are not published.
kuna-analysis = { git = "https://github.com/Noelo-Lab/kuna", rev = "28219c99ff90d89b15010ac25431b8a6374e46b3" }

[profile.release]
opt-level = 2
lto = "thin"
