[package]
name = "ag-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AdmiralGrace desktop analysis workbench"

[[bin]]
name = "ag-ui"
path = "src/main.rs"

[dependencies]
ag-corpus = { path = "../crates/ag-corpus" }
anyhow = "1"
iced = { version = "0.14", features = ["image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced_aw = "0.14"
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
